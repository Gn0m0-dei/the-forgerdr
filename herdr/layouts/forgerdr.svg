<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" shape-rendering="crispEdges">
  <title>forgerdr layout</title>
  <!-- forgerdr: forge tabs on top, the gnome's sidebar, a focused pane beside another, forge heat below -->
