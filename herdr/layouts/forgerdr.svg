  <rect x="0" y="186" width="320" height="14" fill="#18171c"/><rect x="0" y="186" width="320" height="1" fill="#3f3e43"/>
  <rect x="4" y="190" width="16" height="6" fill="#6fa8ff"/><rect x="20" y="190" width="18" height="6" fill="none" stroke="#3f3e43"/>
