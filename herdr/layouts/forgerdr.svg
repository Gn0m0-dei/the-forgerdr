  <rect x="5" y="5" width="4" height="4" fill="#f0607a"/>
  <rect x="11" y="5" width="4" height="4" fill="#f5b43c"/>
  <rect x="17" y="5" width="4" height="4" fill="#8fcf7a"/>
  <rect x="30" y="1" width="46" height="13" fill="#18171c"/>
  <rect x="30" y="1" width="46" height="1" fill="#ff6b1a"/>
