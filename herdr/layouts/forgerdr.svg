    <rect x="35" y="4" width="2" height="2" fill="#d23c4b"/><rect x="34" y="6" width="4" height="2" fill="#d23c4b"/>
    <rect x="34" y="8" width="4" height="2" fill="#f3c7a3"/><rect x="34" y="10" width="4" height="2" fill="#f2f2f2"/>
