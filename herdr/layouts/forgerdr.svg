    <rect x="84" y="8" width="4" height="2" fill="#f3c7a3"/><rect x="84" y="10" width="4" height="2" fill="#f2f2f2"/>
    <rect x="91" y="7" width="20" height="2" fill="#99948e"/><rect x="114" y="6" width="6" height="4" fill="#f5b43c"/>
  </g>
  <g>
    <rect x="129" y="4" width="2" height="2" fill="#5a6fd8"/><rect x="128" y="6" width="4" height="2" fill="#5a6fd8"/>
    <rect x="128" y="8" width="4" height="2" fill="#f3c7a3"/><rect x="128" y="10" width="4" height="2" fill="#f2f2f2"/>
    <rect x="135" y="7" width="22" height="2" fill="#99948e"/>
