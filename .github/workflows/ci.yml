name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1, pinned: the one third-party action
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get install -y shellcheck
      - run: pnpm lint
      - run: npm install -g @fission-ai/openspec
      - run: pnpm test
        env:
          FORGE_REQUIRE_OPENSPEC: "1"
